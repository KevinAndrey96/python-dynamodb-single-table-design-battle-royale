[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dynamodb-battle-royale"
version = "1.0.0"
description = "Single table design en Amazon DynamoDB para un juego battle royale: índices dispersos, índice invertido y transacciones condicionales con Python y boto3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Andrey Herrera Silva", email = "kahs_kevin@hotmail.com" }]
requires-python = ">=3.12"
keywords = ["dynamodb", "single-table-design", "nosql", "boto3", "aws", "data-modeling", "gsi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["boto3>=1.44.12"]

[project.scripts]
battle-royale = "battle_royale.cli:main"

[project.urls]
Repository = "https://github.com/KevinAndrey96/python-dynamodb-single-table-design-battle-royale"

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-boto3[dynamodb]>=1.44.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/battle_royale"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "PL", "ARG", "RET", "TC"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0915", "T201"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: needs DynamoDB Local at DYNAMODB_ENDPOINT_URL"]

[tool.coverage.run]
branch = true
source = ["battle_royale"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
